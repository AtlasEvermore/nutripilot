# Builds the server image on GitHub and publishes it to GitHub Container Registry.
# Lets Railway run a ready-made image when its own builder is unavailable.
name: Server image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/atlasevermore/nutripilot:latest
            ghcr.io/atlasevermore/nutripilot:${{ github.sha }}
