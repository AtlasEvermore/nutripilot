# Builds the server image on GitHub and publishes it to GitHub Container Registry.
# Lets Railway run a ready-made image when its own builder is unavailable.
name: Server image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and regression tests
        working-directory: nutripilot-france-hotmart-final-v4
        run: |
          npm run check
          npm test
          git diff --exit-code -- i18n/
  image:
    if: github.event_name != 'pull_request'
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/atlasevermore/nutripilot:latest
            ghcr.io/atlasevermore/nutripilot:${{ github.sha }}
