name: Production health
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published version, assets, providers and backup age
        id: smoke
        continue-on-error: true
        env:
          CHECK_OPERATIONAL: 'true'
        run: node nutripilot-france-hotmart-final-v4/ops/smoke.mjs > health-report.json
      - name: Maintain a single operational incident
        uses: actions/github-script@v7
        env:
          CHECK_RESULT: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nutripilot-production-health -->';
            const report = JSON.parse(fs.readFileSync('health-report.json', 'utf8'));
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            const body = marker + '\n\nProduction checks detected:\n\n' + report.issues.map(i => '- ' + i).join('\n') + '\n\nCheck: ' + report.checkedAt + '\nRun: https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId + '\n\nThis check does not exercise paid AI calls or prove login/payment availability. See the recovery runbook.';
            if (process.env.CHECK_RESULT !== 'success') {
              if (existing && existing.body !== body) await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
              else if (!existing) await github.rest.issues.create({owner, repo, title: 'NutriPilot production requires attention', body});
              // Production incidents must not block the code release that fixes them.
              // The separate regression/image workflow remains the release gate.
              core.warning('Production verification failed; see the operational issue.');
            } else if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed'});
            }
