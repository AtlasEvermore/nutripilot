# Manual artifact generation only. No App Store upload, submission or backend deploy.
name: iOS signed artifact
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Exact reviewed main commit (40-character SHA)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ios-distribution
  cancel-in-progress: false
jobs:
  ipa:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main' && inputs.revision == github.sha
    runs-on: xcode-27
    timeout-minutes: 40
    environment: ios-signing
    env:
      APP_VERSION: '18.1.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the separately approved signing revision
        env:
          APPROVED_REVISION: ${{ vars.IOS_SIGNING_APPROVED_REVISION }}
        run: |
          set -euo pipefail
          test "$APPROVED_REVISION" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Validate signing safeguards without credentials
        run: python3 -m unittest discover -s ops -p 'test_ios_distribution.py'
      - name: Prepare the native app before loading signing credentials
        working-directory: native
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.1'
          npm ci --no-audit --no-fund
          npm test
          npx cap add ios --packagemanager SPM
          npm run assets
          npx cap sync ios
          node scripts/configure-native.mjs --platform ios
          node scripts/configure-native.mjs --check --platform ios
          xcodebuild -version
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Install the approved certificate in an ephemeral keychain
        env:
          SIGNING_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          SIGNING_PROFILE_BASE64: ${{ secrets.IOS_DISTRIBUTION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'np-signing'
          root.mkdir(mode=0o700)
          for variable, filename in [('SIGNING_P12_BASE64', 'distribution.p12'), ('SIGNING_PROFILE_BASE64', 'app.mobileprovision')]:
              value = os.environ.get(variable, '')
              if not value:
                  raise SystemExit('Required iOS signing secret is absent')
              (root / filename).write_bytes(base64.b64decode(value, validate=True))
          if not os.environ.get('SIGNING_P12_PASSWORD'):
              raise SystemExit('Required signing password is absent')
          PY
          python3 ops/ios-distribution.py profile --profile "$RUNNER_TEMP/np-signing/app.mobileprovision" --directory "$RUNNER_TEMP/np-signing" --project native/ios/App/App.xcodeproj/project.pbxproj
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/np-signing/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/np-signing/distribution.p12" -P "$SIGNING_P12_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          PROFILE_UUID=$(cat "$RUNNER_TEMP/np-signing/profile-uuid.txt")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/np-signing/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Archive and export the signed device IPA without store access
        working-directory: native
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NutriPilot.xcarchive" -disableAutomaticPackageResolution archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NutriPilot.xcarchive" -exportPath "$RUNNER_TEMP/np-ipa" -exportOptionsPlist "$RUNNER_TEMP/np-signing/ExportOptions.plist"
      - name: Verify signature and bind the artifact to this exact revision
        run: |
          set -euo pipefail
          IPA_FILES=( "$RUNNER_TEMP/np-ipa/"*.ipa )
          test "${#IPA_FILES[@]}" -eq 1
          mkdir -p dist/ios
          python3 ops/ios-distribution.py verify --ipa "${IPA_FILES[0]}" --directory "$RUNNER_TEMP/np-verify" --version "$APP_VERSION" --build "$BUILD_NUMBER" --receipt dist/ios/receipt.json
          cp "${IPA_FILES[0]}" dist/ios/NutriPilot.ipa
          (cd dist/ios && shasum -a 256 NutriPilot.ipa > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: nutripilot-ios-signed-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/ios/NutriPilot.ipa
            dist/ios/receipt.json
            dist/ios/SHA256SUMS
      - name: Remove ephemeral signing material even if the build fails
        if: always()
        run: |
          SIGNING_DIR="$RUNNER_TEMP/np-signing"
          if [ -f "$SIGNING_DIR/profile-uuid.txt" ]; then
            PROFILE_UUID=$(cat "$SIGNING_DIR/profile-uuid.txt")
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [ -f "$SIGNING_DIR/signing.keychain-db" ]; then
            security delete-keychain "$SIGNING_DIR/signing.keychain-db"
          fi
          rm -rf "$SIGNING_DIR" "$RUNNER_TEMP/np-verify" "$RUNNER_TEMP/NutriPilot.xcarchive" "$RUNNER_TEMP/np-ipa"
