# Cloud builds for the NutriPilot store apps (no Mac needed) — Capacitor 8.
# Requirements met here: Node 22, Java 21, Xcode 26 (latest), Android target SDK 36.
# Before the first run, in the Codemagic dashboard:
#   - Android: upload the keystore as "nutripilot_keystore"; create the group "google_play" with
#     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play Console service account JSON).
#   - iOS: add the App Store Connect API key integration named "NutriPilot ASC key".
# Every build gets a growing build number ($BUILD_NUMBER), as both stores require.
workflows:
  android-release:
    name: NutriPilot Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: native
    environment:
      node: 22
      java: 21
      android_signing:
        - nutripilot_keystore
      groups:
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        APP_VERSION: "18.1.0"
    scripts:
      - name: Install Capacitor + RevenueCat
        script: npm ci
      - name: Android project
        script: test -d android || npx cap add android
      - name: Icons and splash
        script: npm run assets
      - name: Sync + store settings (permissions, version)
        script: npx cap sync android && BUILD_NUMBER=$BUILD_NUMBER node scripts/configure-native.mjs --platform android && node scripts/configure-native.mjs --check --platform android
      - name: Signing config
        script: |
          grep -q "CM_KEYSTORE_PATH" android/app/build.gradle || cat >> android/app/build.gradle <<'EOF'
          android {
            signingConfigs { release { if (System.getenv("CM_KEYSTORE_PATH")) { storeFile file(System.getenv("CM_KEYSTORE_PATH")); storePassword System.getenv("CM_KEYSTORE_PASSWORD"); keyAlias System.getenv("CM_KEY_ALIAS"); keyPassword System.getenv("CM_KEY_PASSWORD") } } }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          EOF
      - name: Build app bundle
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

    # Signed artifacts only. Store upload requires the release gate and separate review.

  ios-release:
    name: NutriPilot iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: native
    integrations:
      app_store_connect: NutriPilot ASC key
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.atlasevermore.nutripilot
      vars:
        APP_VERSION: "18.1.0"
    scripts:
      - name: Install Capacitor + RevenueCat
        script: npm ci
      - name: iOS project
        script: test -d ios || npx cap add ios
      - name: Icons and splash
        script: npm run assets
      - name: Sync + store settings (camera texts, encryption, version)
        script: npx cap sync ios && BUILD_NUMBER=$BUILD_NUMBER node scripts/configure-native.mjs --platform ios && node scripts/configure-native.mjs --check --platform ios
      - name: Code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    # Signed artifacts only. Store upload requires the release gate and separate review.
